name: Build Mi A3 Kernel with KSUNext

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git libncurses5-dev libssl-dev \
            libxml2-utils lzop python3 wget zip

      - name: Download kernel code
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Add KernelSU-Next (Legacy 4.14)
        run: |
          RAW_HOST="://raw.githubusercontent.com"
          KSU_PATH="KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          curl -LSs "https://${RAW_HOST}/${KSU_PATH}" | bash -s legacy

      - name: Download Android Compilers
        run: |
          mkdir -p clang
          AOSP_HOST="://android.googlesource.com"
          CLANG_PATH="platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
          wget -q "https://${AOSP_HOST}/${CLANG_PATH}" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang

          GH_HOST="github.com"
          git clone --depth=1 -b lineage-19.1 "https://${GH_HOST}/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" gcc64
          git clone --depth=1 -b lineage-19.1 "https://${GH_HOST}/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" gcc32

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH"

          if [ -f "arch/arm64/configs/vendor/laurel_sprout-perf_defconfig" ]; then
            DEFCONFIG="vendor/laurel_sprout-perf_defconfig"
          else
            DEFCONFIG="laurel_sprout_defconfig"
          fi

          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> arch/arm64/configs/$DEFCONFIG

          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Pack into Flashable Zip
        run: |
          GH_HOST="github.com"
          AK3_USER="SysAdminDion"
          git clone --depth=1 "https://${GH_HOST}/${AK3_USER}/AnyKernel3.git" anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img anykernel/
          cd anykernel
          zip -r9 ../MiA3-LinOS24-KSUNext.zip * -x .git README.md *placeholder

      - name: Save Downloadable Zip
        uses: actions/upload-artifact@v4
        with:
          name: MiA3-Kernel-Zip
          path: MiA3-LinOS24-KSUNext.zip
